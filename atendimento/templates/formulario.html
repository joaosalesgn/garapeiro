{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1>{{ titulo }}</h1>
<section class="card"><form method="post">{% csrf_token %}{{ form.non_field_errors }}
{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}{{ field.errors }}</div>{% endfor %}
<div class="toolbar"><button type="submit">Salvar</button><a class="btn secondary" href="{% url voltar %}">Voltar</a></div></form></section>
<script>
(function(){const canal=document.getElementById('id_canal'), mesa=document.getElementById('id_mesa');if(!canal||!mesa)return;function atualiza(){mesa.closest('.field').style.display=canal.value==='MESA'?'block':'none';if(canal.value!=='MESA')mesa.value=''}canal.addEventListener('change',atualiza);atualiza()})();
</script>
{% endblock %}
